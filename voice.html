<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talking Robot Mode</title>
  <!-- Load Stable Paho MQTT Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
  <style>
    :root { --bg: #121214; --card: #1e1e24; --accent: #00e5ff; --success: #00e676; --danger: #ff5252; --text: #ffffff; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; margin: 0; text-align: center; }
    .card { background: var(--card); padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; }
    h1 { margin-top: 0; color: var(--accent); font-size: 1.8rem; }
    .controls { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
    button { background: var(--accent); color: #000; border: none; padding: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    button.active { background: var(--danger); color: #fff; }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }
    .status-badge { padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; background: #2a3b4c; color: var(--accent); display: inline-block; margin-bottom: 10px; }
    .status-badge.active { background: #1b4d2e; color: var(--success); }
    
    /* Log and Chat Styles */
    .chat-box { background: #000; padding: 15px; border-radius: 6px; height: 220px; overflow-y: auto; text-align: left; font-size: 0.9rem; margin-top: 15px; border: 1px solid #333; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; word-wrap: break-word; line-height: 1.3; }
    .msg.user { color: #fff; background: #005b66; align-self: flex-end; }
    .msg.robot { color: #fff; background: #1b4d2e; align-self: flex-start; }
    
    .chat-input-row { display: flex; gap: 8px; margin-top: 12px; }
    .chat-input-row input { flex: 1; background: #121214; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; font-size: 0.95rem; outline: none; }
    .chat-input-row input:focus { border-color: var(--accent); }
    .chat-input-row button { padding: 12px 18px; width: auto; }

    .back-link { margin-top: 20px; display: inline-block; color: #888; text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🗣️ Talking Robot</h1>
    <span id="statusBadge" class="status-badge">Status: Offline</span>

    <div class="controls">
      <button id="btnConnect">1. Connect to Cloud Server</button>
      <button id="btnTalk" disabled>2. Tap to Speak 🎙️</button>
    </div>

    <!-- Live Talking Log -->
    <div class="chat-box" id="chatBox">
      <div class="msg robot">Robot: Connect to the cloud and talk or type to me!</div>
    </div>

    <!-- Text Chat Input -->
    <div class="chat-input-row">
      <input type="text" id="textInput" placeholder="Type a message..." disabled>
      <button id="btnSend" disabled>Send</button>
    </div>

    <a href="index.html" class="back-link">← Back to Hub</a>
  </div>

  <script>
    const MQTT_BROKER = "broker.hivemq.com";
    const MQTT_PORT = 8884;
    const MQTT_TOPIC = "zidansyam14_robot_face_tracking_topic";

    let mqttClient;
    let isConnected = false;
    let mouthInterval = null;

    const btnConnect = document.getElementById("btnConnect");
    const btnTalk = document.getElementById("btnTalk");
    const statusBadge = document.getElementById("statusBadge");
    const chatBox = document.getElementById("chatBox");
    const textInput = document.getElementById("textInput");
    const btnSend = document.getElementById("btnSend");

    // --- 1. MQTT SETUP ---
    btnConnect.addEventListener("click", () => {
      if (!isConnected) {
        btnConnect.innerText = "Connecting...";
        const clientId = "voice_" + Math.random().toString(16).substr(2, 8);
        mqttClient = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, clientId);

        mqttClient.onConnectionLost = () => {
          isConnected = false;
          btnConnect.innerText = "1. Connect to Cloud Server";
          btnConnect.classList.remove("active");
          statusBadge.innerText = "Status: Offline";
          statusBadge.className = "status-badge";
          btnTalk.disabled = true;
          textInput.disabled = true;
          btnSend.disabled = true;
        };

        mqttClient.connect({
          useSSL: true,
          onSuccess: () => {
            isConnected = true;
            btnConnect.innerText = "Disconnect Cloud";
            btnConnect.classList.add("active");
            statusBadge.innerText = "Status: Online";
            statusBadge.className = "status-badge active";
            btnTalk.disabled = false;
            textInput.disabled = false;
            btnSend.disabled = false;
          },
          onFailure: (err) => {
            alert("Connection failed: " + err.errorMessage);
            btnConnect.innerText = "1. Connect to Cloud Server";
          }
        });
      } else {
        mqttClient.disconnect();
      }
    });

    // --- 2. SPEECH RECOGNITION ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        btnTalk.innerText = "Listening... 🎧";
        btnTalk.style.background = "var(--success)";
      };

      recognition.onresult = (event) => {
        const userText = event.results[0][0].transcript;
        handleUserInput(userText);
      };

      recognition.onerror = () => { resetTalkBtn(); };
      recognition.onend = () => { resetTalkBtn(); };

      btnTalk.addEventListener("click", () => {
        try { recognition.start(); } catch(e){}
      });
    } else {
      btnTalk.innerText = "Speech Recognition Not Supported";
      btnTalk.disabled = true;
    }

    function resetTalkBtn() {
      btnTalk.innerText = "2. Tap to Speak 🎙️";
      btnTalk.style.background = "var(--accent)";
    }

    // --- 3. CHAT INPUT HANDLING ---
    btnSend.addEventListener("click", sendTextMessage);
    textInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendTextMessage();
    });

    function sendTextMessage() {
      const text = textInput.value.trim();
      if (text !== "") {
        handleUserInput(text);
        textInput.value = "";
      }
    }

    // --- 4. DIALOG LOGIC ---
    function handleUserInput(userText) {
      addChat("You", userText, "user");
      
      const lower = userText.toLowerCase();
      let reply = "I heard you, but I am still learning how to answer that!";

      if (lower.includes("hello") || lower.includes("hi")) {
        reply = "Hello there! Nice to meet you.";
      } else if (lower.includes("name")) {
        reply = "My name is LOFI Robot!";
      } else if (lower.includes("how are you")) {
        reply = "I am doing great, ready to talk!";
      } else if (lower.includes("dance") || lower.includes("move")) {
        reply = "I am opening my jaw and talking right now!";
      } else if (lower.includes("bye")) {
        reply = "Goodbye! Talk to you later.";
      }

      addChat("Robot", reply, "robot");
      speakAndAnimateMouth(reply);
    }

    // --- 5. TEXT TO SPEECH & MOUTH SERVO SYNC ---
    function speakAndAnimateMouth(text) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel(); 
      const utterance = new SpeechSynthesisUtterance(text);

      utterance.onstart = () => {
        clearInterval(mouthInterval);
        mouthInterval = setInterval(() => {
          const randomMouth = Math.floor(Math.random() * 60) + 20;
          sendMQTTData(randomMouth);
        }, 80);
      };

      utterance.onend = () => {
        clearInterval(mouthInterval);
        sendMQTTData(0);
      };

      window.speechSynthesis.speak(utterance);
    }

    // --- 6. MQTT TELEMETRY ---
    function sendMQTTData(mouthGap) {
      if (isConnected && mqttClient) {
        const payload = `0,0,0,0,0,${mouthGap},0,100,100\n`;
        const message = new Paho.MQTT.Message(payload);
        message.destinationName = MQTT_TOPIC;
        mqttClient.send(message);
      }
    }

    function addChat(sender, text, type) {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      div.innerText = `${sender}: ${text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
