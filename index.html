<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Control Hub</title>
  <style>
    :root { --bg: #121214; --card: #1e1e24; --accent: #00e5ff; --text: #ffffff; --hover: #00b3cc; }
    body { 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 90vh; 
      text-align: center; 
      margin: 0; 
    }
    .card { 
      background: var(--card); 
      padding: 40px; 
      border-radius: 12px; 
      width: 100%; 
      max-width: 500px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      box-sizing: border-box;
    }
    h1 { margin-top: 0; color: var(--accent); font-size: 2rem; margin-bottom: 10px; }
    p { color: #aaa; margin-bottom: 30px; font-size: 1.1rem; }
    .button-container { display: flex; flex-direction: column; gap: 15px; }
    a { text-decoration: none; }
    button { 
      background: var(--accent); 
      color: #000; 
      border: none; 
      padding: 18px; 
      width: 100%; 
      font-weight: bold; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 1.1rem; 
      transition: 0.2s; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      box-sizing: border-box;
    }
    button:hover { background: var(--hover); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 229, 255, 0.3); }
    .secondary-btn { background: #3a3a45; color: #fff; border: 2px solid var(--accent); }
    .secondary-btn:hover { background: var(--accent); color: #000; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🤖 Robot Control Hub</h1>
    <p>Select an operational mode:</p>
    
    <div class="button-container">
      <a href="camera.html">
        <button>📱 Remote Face Tracking</button>
      </a>

      <a href="voice.html">
        <button>🗣️ Talking Robot Mode</button>
      </a>

      <a href="robot.html">
        <button class="secondary-btn">💻 Robot Host (Arduino Receiver)</button>
      </a>
    </div>
  </div>

</body>
</html>
